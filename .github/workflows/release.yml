# On a v* tag: test, build a universal app, and publish it as a GitHub release.
# Unsigned by choice. The README explains first launch.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: swift run leafjuice-check
      - run: scripts/build-app.sh --dmg
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/LeafJuice-*.dmg dist/LeafJuice-*.zip \
            --title "Leaf Juice $GITHUB_REF_NAME" \
            --notes "Download the .dmg and drag Leaf Juice to Applications. It's unsigned, so see the README for how to approve the first launch."
