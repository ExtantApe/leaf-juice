# On a v* tag: test, build a universal app, and publish it as a GitHub release.
# Unsigned by choice. The README explains first launch.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: swift run leafjuice-check
      - run: scripts/build-app.sh --dmg
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Download the .dmg and drag LeafJuice to Applications. It's unsigned, so macOS blocks the first launch. Allow it one of two ways:

          **System Settings:** try to open the app once, then go to System Settings > Privacy & Security, scroll down, click **Open Anyway**, and click **Open** when the warning comes back. Apple says to do this only for an app you trust.

          **Terminal:**

          ```
          xattr -dr com.apple.quarantine "/Applications/LeafJuice.app"
          ```

          What changed is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/LeafJuice-*.dmg dist/LeafJuice-*.zip \
            --title "LeafJuice $GITHUB_REF_NAME" \
            --notes-file notes.md
