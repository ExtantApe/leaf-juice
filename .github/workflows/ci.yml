name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Leak check (emails and build output; private terms are only checked locally)
        run: bash scripts/leak-check.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Tests, including the server lifecycle against a stand-in jar
        run: swift run leafjuice-check
      - name: The app builds and bundles
        run: scripts/build-app.sh
